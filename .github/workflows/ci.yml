name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate dependencies and lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Verify generated lockfile digest
        run: echo "24cf180f7ff0d617c09eb87ef566fe7a43e8dd187e9524c9cdba866021732a2a  pnpm-lock.yaml" | sha256sum --check --strict

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build and package extension ZIP
        run: pnpm zip
